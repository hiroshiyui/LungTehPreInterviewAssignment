---
# ---------------------------------------------------------------------------
# Pinned versions -- change these deliberately; everything else follows.
# ---------------------------------------------------------------------------
uv_version: "0.12.20"            # https://github.com/astral-sh/uv/releases
python_version: "3.14"           # frappe develop: requires-python >=3.14,<3.15
nodejs_major: 24                 # frappe develop: engines.node >=24
yarn_version: "1.22.22"
bench_version: "5.31.0"          # frappe-bench CLI (PyPI)

frappe_repo: https://github.com/frappe/frappe.git
frappe_branch: develop
# Exact develop commit that was built and tested. Set to "" to build
# whatever the tip of `develop` is at provisioning time (not reproducible).
frappe_commit: 85e1148ec7c87bcd5939457a6adc3d9774020dcb

# ---------------------------------------------------------------------------
# Where this runs: "vm" (Vagrant, test container) or "container" (compose;
# see vars/container.yml, which also sets the service addresses below).
# ---------------------------------------------------------------------------
deploy_target: vm
db_host: ""                      # "" = local MariaDB
redis_cache_url: ""              # "" = bench-managed local redis
redis_queue_url: ""

# ---------------------------------------------------------------------------
# Bench / site layout
# ---------------------------------------------------------------------------
frappe_user: frappe              # Vagrantfile overrides this with "vagrant"
frappe_home: "/home/{{ frappe_user }}"
bench_name: frappe-bench
bench_path: "{{ frappe_home }}/{{ bench_name }}"
bench_bin: "{{ frappe_home }}/.local/bin/bench"
frappe_src_path: "{{ frappe_home }}/src/frappe"

site_name: hrcost.localhost
# Development-only credentials; this VM is bound to 127.0.0.1 on the host.
admin_password: admin
mariadb_root_password: frappe

# Environment for every command run as the bench user.
bench_env:
  HOME: "{{ frappe_home }}"
  PATH: "{{ frappe_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

# ---------------------------------------------------------------------------
# Custom app
# ---------------------------------------------------------------------------
app_name: hr_cost
app_source_path: /vagrant/apps/hr_cost
load_demo_data: true
run_app_tests: true
