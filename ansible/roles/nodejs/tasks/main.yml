---
- name: Add the NodeSource apt repository for Node.js {{ nodejs_major }}
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: "https://deb.nodesource.com/node_{{ nodejs_major }}.x"
    suites: [nodistro]
    components: [main]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
  register: nodejs_repo

- name: Refresh apt cache after adding NodeSource  # noqa: no-handler -- must run before the install task below, not at the end of the play
  ansible.builtin.apt:
    update_cache: true
  when: nodejs_repo is changed

- name: Install Node.js {{ nodejs_version }}
  ansible.builtin.apt:
    name: "nodejs={{ nodejs_version }}"
    state: present
    allow_downgrade: true   # moving the pin back must work too

- name: Verify the installed Node.js version
  ansible.builtin.command: node --version
  register: nodejs_version_check
  changed_when: false
  # 24.21.0-1nodesource1 installs node v24.21.0
  failed_when: nodejs_version_check.stdout != 'v' ~ nodejs_version.split('-')[0]

- name: Check installed yarn version
  ansible.builtin.command: yarn --version
  register: nodejs_yarn_version
  changed_when: false
  failed_when: false

- name: Install yarn {{ yarn_version }}
  ansible.builtin.command: npm install --global yarn@{{ yarn_version }}
  when: nodejs_yarn_version.rc != 0 or nodejs_yarn_version.stdout != yarn_version
  changed_when: true
