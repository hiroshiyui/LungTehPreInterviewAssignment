---
- name: Install OS packages needed to build and run Frappe
  ansible.builtin.apt:
    name:
      - build-essential
      - acl
      - ca-certificates
      - cron
      - curl
      - file              # used by `bench restore` to detect archive types
      # Server-side fonts for PDFs: employees come from many countries, and a name
      # in a script without a font prints as empty boxes.
      - fonts-noto-cjk    # Chinese, Japanese, Korean
      - fonts-noto-core   # most other scripts: Thai, Burmese, Khmer, Lao, Vietnamese, ...
      - git
      - gnupg
      - libffi-dev
      - libmariadb-dev
      - libssl-dev
      - mariadb-client
      - pkg-config
      - python3-debian
      - rsync
      - wkhtmltopdf       # Frappe's PDF engine: the reports' "Download PDF"
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

# Containers use the redis-cache / redis-queue compose services instead, share
# the host kernel (no sysctl) and have no systemd.
- name: VM-only packages and system settings
  when: deploy_target == 'vm'
  block:
    # bench runs its own redis-cache / redis-queue processes from the Procfile;
    # it needs the redis-server binary, but not the distro's service.
    - name: Install redis-server
      ansible.builtin.apt:
        name: redis-server
        state: present

    - name: Disable the system redis-server service
      ansible.builtin.systemd_service:
        name: redis-server
        state: stopped
        enabled: false

    - name: Raise inotify watch limit for `bench watch` / esbuild
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-frappe-inotify.conf
        content: |
          fs.inotify.max_user_watches = 524288
        mode: "0644"
      notify: Reload sysctl

- name: Ensure the bench user exists
  ansible.builtin.user:
    name: "{{ frappe_user }}"
    shell: /bin/bash
    create_home: true

- name: Make the bench user's home traversable (static assets are served from it)
  ansible.builtin.file:
    path: "{{ frappe_home }}"
    mode: "0755"
