---
- name: Wait for the Frappe web server
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/api/method/ping
    return_content: true
  register: verify_ping
  until: verify_ping.status == 200 and verify_ping.json.message == 'pong'
  retries: 60
  delay: 5

- name: Log in as Administrator
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/api/method/login
    method: POST
    body_format: json
    body:
      usr: Administrator
      pwd: "{{ admin_password }}"
  register: verify_login
  no_log: true

- name: Run the Daily HR Cost report through the REST API
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/api/method/frappe.desk.query_report.run?{{ verify_report_query | urlencode }}"
    headers:
      Cookie: "{{ verify_login.cookies_string }}"
    return_content: true
  vars:
    verify_report_query:
      report_name: Daily HR Cost
      filters: "{{ {'from_date': '2000-01-01', 'to_date': '2100-12-31'} | to_json }}"
  register: verify_report

- name: Check the report returned data
  ansible.builtin.assert:
    that:
      - verify_report.json.message.columns | length > 0
      - (not load_demo_data | bool) or (verify_report.json.message.result | length > 0)
    quiet: true

# Reproducibility: the bench must hold exactly the constrained Python packages.
- name: List the bench's Python packages
  become: true
  become_user: "{{ frappe_user }}"
  environment: "{{ bench_env }}"
  ansible.builtin.command:
    argv: [uv, pip, freeze, --exclude-editable, --python, env/bin/python]
    chdir: "{{ bench_path }}"
  register: verify_python_freeze
  changed_when: false

- name: Read the Python constraints
  ansible.builtin.slurp:
    src: "{{ python_constraints_path }}"
  register: verify_python_constraints

- name: Check the packages match the constraints
  vars:
    verify_pinned: '^[A-Za-z0-9_.-]+=='
    verify_installed: "{{ verify_python_freeze.stdout_lines | select('match', verify_pinned) | map('lower') | list }}"
    verify_expected: >-
      {{ (verify_python_constraints.content | b64decode).splitlines()
         | select('match', verify_pinned) | map('lower') | list }}
  ansible.builtin.assert:
    that: verify_installed | sort == verify_expected | sort
    fail_msg: >-
      The bench's Python packages differ from roles/bench/files/python-constraints.txt.
      Installed but not constrained: {{ verify_installed | difference(verify_expected) }}.
      Constrained but not installed: {{ verify_expected | difference(verify_installed) }}.
      After moving frappe_commit, regenerate the file with scripts/freeze-python-deps.sh.
    quiet: true

- name: Run the app's unit tests
  become: true
  become_user: "{{ frappe_user }}"
  environment: "{{ bench_env }}"
  ansible.builtin.command:
    argv: ["{{ bench_bin }}", --site, "{{ site_name }}", run-tests, --app, "{{ app_name }}"]
    chdir: "{{ bench_path }}"
  when: run_app_tests | bool
  changed_when: false

- name: Done
  ansible.builtin.debug:
    msg:
      - "Frappe {{ frappe_branch }} is up. Open http://localhost:8000 on the host."
      - "Login: Administrator / {{ admin_password }}"
      - "Report: http://localhost:8000/desk/query-report/Daily HR Cost"
